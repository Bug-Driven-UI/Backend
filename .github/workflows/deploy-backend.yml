name: deploy-backend.yml
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Action

    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL || vars.POSTGRES_URL }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run tests
        run: ./gradlew test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t darktype/bdui-x:latest .

      - name: Push Docker image
        run: docker push darktype/bdui-x:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          POSTGRES_URL: ${{ env.POSTGRES_URL }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/app

            echo "Creating .env file..."
             cat > .env <<'EOF'
  POSTGRES_URL=${POSTGRES_URL}
  POSTGRES_USER=${POSTGRES_USER}
  POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  EOF
  
  echo "Current .env content:"
  cat .env
  
  echo "Pulling latest images..."
  docker compose pull backend
  
  echo "Checking final config..."
  docker compose config | grep POSTGRES || true
  
  echo "Starting backend..."
  docker compose up -d backend