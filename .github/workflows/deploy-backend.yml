name: deploy-backend.yml
on:
  push:
    branches: [ final ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Action

    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL || vars.POSTGRES_URL }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SECURITY_API_KEY: ${{ secrets.SECURITY_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run tests
        run: ./gradlew test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t darktype/bdui-x:latest .

      - name: Push Docker image
        run: docker push darktype/bdui-x:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/deploy/app

            POSTGRES_URL="${{ secrets.POSTGRES_URL || vars.POSTGRES_URL }}" \
            POSTGRES_USER="${{ secrets.POSTGRES_USER || vars.POSTGRES_USER }}" \
            POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            SECURITY_API_KEY="${{ secrets.SECURITY_API_KEY }}" \
            bash -c '
              set -e

              echo "Creating .env file..."
              printf "POSTGRES_URL=%s\n" "$POSTGRES_URL" > .env
              printf "POSTGRES_USER=%s\n" "$POSTGRES_USER" >> .env
              printf "POSTGRES_PASSWORD=%s\n" "$POSTGRES_PASSWORD" >> .env

              echo "Wrote .env (truncated check):"
              echo "POSTGRES_URL=${POSTGRES_URL:0:30}..."
              echo "POSTGRES_USER=${POSTGRES_USER}"

              echo "Pulling latest images..."
              docker compose pull backend

              echo "Starting backend..."
              docker compose up -d backend
            '